name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # typecheck, lint and unit tests; anything that needs a GPU (shader compile, golden images) runs locally
      - run: npm run check
      # builds the single file and fails if it is over the size budget
      - run: npm run build
      # what goes on the web: the file itself, and a picture for when a link to it is shared
      - name: Put the site together
        if: github.event_name == 'push'
        run: |
          mkdir site
          cp dist/index.html site/index.html
          cp docs/hero.jpg site/preview.jpg
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push'
        with:
          path: site

  # every push to main that passes the checks is published at https://richman-tan.github.io/hollowtide/
  publish:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
