<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Hollowtide</title>
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#03131c>
<style>
/* The class on <body> is the state of the page:
   loading   the descent: a diver sinks while the world is made (loading failed: it could not be)
   home      the world from a drifting camera, the title, "W A S D to dive"
   waking    the dive has begun: eyelids opening on the seabed
   playing   in the water (playing captured while the mouse is captured)
   menu      paused: the world blurred behind a panel
   The pause panel's look follows the menu of Abyssal Garden by Noniv (MIT). */
html { background: #000; }
body {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000;
  font: 700 clamp(13px, .7vw + .9vh, 36px)/1.4 system-ui, sans-serif; color: #e8fbff;
  -webkit-user-select: none; user-select: none;
}
/* a phone held upright gets the whole page turned on its side, so the scene is always landscape */
@media (orientation: portrait) and (pointer: coarse) {
  body { width: 100dvh; height: 100dvw; transform-origin: 0 0; transform: rotate(90deg) translateY(-100%); }
}

/* the scene, and over it the veil: the descent, the black, the eyelids (src/ui/veil.ts) */
canvas { position: absolute; width: 100%; height: 100%; }
#scene { touch-action: none; cursor: crosshair; transition: filter 1s, transform 1s; }
#veil { pointer-events: none; }
.loading #scene { visibility: hidden; }
.menu #scene { filter: blur(1vmax) brightness(.5); transform: scale(1.06); }
/* the eyes open on a picture that is still swimming into focus */
.waking #scene { animation: focus 2.7s ease-out both; transition: none; }
@keyframes focus {
  0% { filter: blur(1.6vmax) brightness(.7); transform: scale(1.05); }
  55% { filter: blur(.7vmax) brightness(.9); }
  100% { filter: blur(0) brightness(1); transform: scale(1); }
}

#menu {
  position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: min(2.2em, 6vmin);
  padding: 1em 1em 4.5em; text-align: center; transition: opacity .6s, visibility .6s;
}
.playing #menu, .waking #menu { opacity: 0; visibility: hidden; }
p { margin: 0; }
h1 {
  margin: 0; font: 200 4.6em/1 system-ui, sans-serif; letter-spacing: .34em; margin-right: -.34em; text-transform: uppercase;
  color: #f2fdff; text-shadow: 0 0 .5em #7ff3ff99, 0 .05em .3em #000a;
}

/* ---- the descent: the title up top while there is daylight, the depth and what is being made below */
.loading #menu { place-content: space-between center; padding: 9vh 1em 8vh; }
.loading h1 { font-size: 2.6em; opacity: .85; }
#loading { display: none; width: 22em; max-width: 100%; }
.loading #loading { display: block; }
.loading #actions { display: none; }
#depth { font: 200 3.6em/1.1 system-ui, sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .04em; text-shadow: 0 .05em .4em #000c; }
#track { height: 2px; margin: .9em 0 .8em; overflow: hidden; background: #e8fbff26; }
#bar { display: block; height: 100%; background: #9ff6ff; transform: scaleX(0); transform-origin: 0; transition: transform .5s cubic-bezier(.3, .5, .5, 1); }
#status, #detail, #light, #keys, #touch-hint { font-size: .8em; letter-spacing: .12em; text-transform: uppercase; }
#status { font-weight: 500; letter-spacing: .28em; opacity: .8; }
.failed #track, .failed #depth { visibility: hidden; }
.failed #status { font-size: 1.1em; letter-spacing: 0; text-transform: none; opacity: 1; }

/* ---- buttons */
button, a {
  display: flex; align-items: center; justify-content: center; gap: .6em; padding: .8em 1.4em; border: 0;
  border-radius: .5em; background: #fff; box-shadow: inset 0 -.2em #0003, 0 .3em 1em #0009;
  font: 800 1em/1.2 system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; text-decoration: none;
  color: #03222d; cursor: pointer; transition: transform .12s, filter .12s;
}
button:hover, a:hover { transform: translateY(-.12em); filter: brightness(1.15); }
button:active, a:active { transform: translateY(.1em); filter: brightness(.9); }
:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
#actions { display: grid; justify-items: center; gap: min(1.2em, 3.5vmin); }
#keys b, #dive b {
  min-width: 1.1em; padding: .2em .5em; border-radius: .35em; background: #e8fbff;
  box-shadow: inset 0 -.15em #0004; color: #03222d; text-align: center;
}

/* ---- home: the world itself is the picture; a title, one thing to do, the rest kept small at the bottom */
.home #menu {
  place-content: space-between center; padding: 15vh 1em 5.5em;
  background: radial-gradient(ellipse at 50% 45%, #03131c00 40%, #03131c73), linear-gradient(#03131c59, #03131c00 30%, #03131c00 66%, #03131cb3);
}
.home h1 { animation: surface 2.4s ease-out both; }
@keyframes surface { from { opacity: 0; letter-spacing: .6em; margin-right: -.6em; filter: blur(.25em); } }
.home #dive {
  padding: .9em 1.2em; background: none; box-shadow: none; color: #e8fbff; font-weight: 500; letter-spacing: .3em;
  text-shadow: 0 .05em .4em #000; animation: surface 2.4s 1s ease-out both, breathe 2.6s 3.4s ease-in-out infinite;
}
.home #dive i { display: flex; gap: .3em; font-style: normal; letter-spacing: 0; text-shadow: none; }
.home #dive b { font-weight: 800; box-shadow: inset 0 -.15em #0004, 0 0 1em #7ff3ff99; }
@keyframes breathe { 50% { opacity: .55; } }
#tap { display: none; }
@media (pointer: coarse) { .home #dive i, .home #press { display: none; } .home #tap { display: inline; } }
.home #keys, .home #touch-hint { display: none; }
.home #detail { position: absolute; left: 1.4em; bottom: 1.3em; background: none; padding: 0; opacity: .75; }
.home #light { position: absolute; right: 1.4em; bottom: 1.3em; background: none; padding: 0; opacity: .75; }

/* ---- paused: a panel over the blurred world */
.menu #menu { background: radial-gradient(#03131c00 30%, #03131ccc); }
.menu h1 { font-size: 3em; }
.menu #actions {
  grid-template: "dive dive" auto "detail keys" auto "light keys" auto "settings keys" 1fr / 27em auto; align-items: start;
  max-width: 100%; justify-items: stretch;
}
.menu #dive { grid-area: dive; }
.menu #detail { grid-area: detail; }
.menu #light { grid-area: light; }
.menu #settings { grid-area: settings; }
.menu #keys, .menu #touch-hint { grid-area: keys; }
@media (pointer: coarse), (max-height: 30em), (max-width: 60em) { .menu #actions { grid-template: none; width: 27em; } .menu #actions > * { grid-area: auto; } }
.menu #dive { padding: .9em; background: linear-gradient(#9ff6ff, #19c3d6); font-size: 1.3em; box-shadow: inset 0 -.2em #0003, 0 0 2em #19c3d6b3; }
/* dark plates under the resume button: detail level, settings, list of controls, touch hint */
#detail, #light, #settings, #keys, #touch-hint { padding: 1em 1.6em; border-radius: .7em; background: #03131cb3; }
/* a choice: a label and its options in a row, the current one lit */
.choice { display: flex; align-items: center; gap: .4em; }
#detail, #light { padding: .4em; }
.choice span { flex: 1; padding: 0 .8em; color: #7ff3ff; text-align: left; }
.choice button { flex: 1.2; padding: .7em 1em; background: none; box-shadow: none; color: #e8fbff; white-space: nowrap; }
.choice button:hover { background: #7ff3ff33; }
.choice .on { background: linear-gradient(#9ff6ff, #19c3d6); box-shadow: inset 0 -.2em #0003; color: #03222d; pointer-events: none; }
/* settings: sliders and choices, one to a row */
#settings { display: grid; gap: .35em; padding: .6em .4em; font-size: .8em; letter-spacing: .12em; text-transform: uppercase; }
#settings label { display: flex; align-items: center; gap: .4em; padding: .35em 0; }
#settings label span { flex: 1; padding: 0 .8em; color: #7ff3ff; text-align: left; }
#settings input { flex: 2.4; margin: 0 .8em 0 0; accent-color: #19c3d6; cursor: pointer; }
#settings .choice button { padding: .55em .8em; }
.home #settings { display: none; }
/* list of controls: two groups, key caps right-aligned against their labels */
#keys { display: grid; gap: 1.2em; text-align: left; }
#keys p { display: grid; grid-template-columns: auto auto; align-content: start; align-items: center; gap: .55em .9em; }
#keys p + p { padding-top: 1.2em; border-top: 2px solid #7ff3ff40; }
#keys i { display: flex; justify-self: end; align-items: center; gap: .25em; font-style: normal; }
#touch-hint { display: none; }
@media (pointer: coarse), (max-height: 30em) { #keys { display: none; } }
@media (pointer: coarse) { .menu #touch-hint { display: block; } }

/* ---- in the scene: a small menu button (hidden while the mouse is captured, Esc does the same) and the stats line */
#open-menu {
  position: absolute; top: .6em; right: .6em; display: none; padding: .3em .6em; background: #03222dd9;
  box-shadow: inset 0 0 0 2px #7ff3ff, 0 .3em 1em #0009; font-size: 1.3em; color: #e8fbff; opacity: .8;
}
.playing #open-menu, .playing #mute { display: flex; }
.captured #open-menu, .captured #mute { display: none; }
/* the sound button beside it: struck through when the sound is off */
#mute {
  position: absolute; top: .6em; right: 3.4em; display: none; padding: .3em .7em; background: #03222dd9;
  box-shadow: inset 0 0 0 2px #7ff3ff, 0 .3em 1em #0009; font-size: 1.3em; color: #e8fbff; opacity: .8;
}
#mute[aria-pressed=true] { color: #7ff3ff80; text-decoration: line-through; box-shadow: inset 0 0 0 2px #7ff3ff60, 0 .3em 1em #0009; }
#stats {
  position: absolute; top: 1em; left: 1.2em; margin: 0; font: .8em/1.6 ui-monospace, Consolas, monospace;
  white-space: pre-wrap; text-shadow: 0 1px 4px #000; pointer-events: none;
}
/* a line that comes up for a few seconds when a key has changed something that cannot otherwise be seen */
#note {
  position: absolute; left: 50%; bottom: 9vh; transform: translateX(-50%); padding: .6em 1.3em; border-radius: 2em;
  background: #03131ccc; box-shadow: 0 0 0 1px #7ff3ff40; font-size: .85em; font-weight: 500; letter-spacing: .06em;
  white-space: nowrap; opacity: 0; transition: opacity .5s; pointer-events: none;
}
#note.on { opacity: 1; }
/* photo mode: nothing on the picture but its one line of keys, and that faint */
.photo #stats, .photo #open-menu, .photo #mute { display: none; }
.photo #note { opacity: .55; }
#note b { padding: .1em .45em; border-radius: .3em; background: #e8fbff; color: #03222d; font-weight: 800; }
@media (prefers-reduced-motion: reduce) {
  .waking #scene, .home h1, .home #dive { animation: none; }
}
</style>
</head>
<body class=loading>
<canvas id=scene></canvas>
<canvas id=veil></canvas>
<div id=menu>
  <h1>Hollowtide</h1>
  <div id=loading>
    <p id=depth>0.0 m</p>
    <div id=track><i id=bar></i></div>
    <p id=status aria-live=polite>Diving…</p>
  </div>
  <div id=actions>
    <button id=dive><i><b>W</b><b>A</b><b>S</b><b>D</b></i><span id=press>to dive</span><span id=tap>Tap to dive</span></button>
    <p id=detail class=choice><span>Detail</span><button>Low</button><button>Medium</button><button>High</button></p>
    <p id=light class=choice><span>Light</span><button>Noon</button><button>Dusk</button><button>Moonlit</button></p>
    <div id=settings>
      <label><span>Look speed</span><input id=look type=range min=0.3 max=2.5 step=0.05></label>
      <label><span>Field of view</span><input id=fov type=range min=0.85 max=1.2 step=0.01></label>
      <label><span>Volume</span><input id=volume type=range min=0 max=1 step=0.02></label>
      <p id=invert class=choice><span>Up and down</span><button>Normal</button><button>Inverted</button></p>
      <p id=picture class=choice><span>Picture</span><button>Smooth</button><button>Sharp</button></p>
      <p id=swim class=choice><span>Swimming</span><button>With arms</button><button>Classic</button></p>
    </div>
    <div id=keys>
      <p>
        <i><b>W</b><b>A</b><b>S</b><b>D</b></i>Swim
        <i><b>Q</b><b>E</b></i>Down / up
        <i><b>Shift</b></i>Scooter
        <i><b>1</b>–<b>6</b></i>Viewpoints
      </p>
      <p>
        <i><b>Esc</b></i>Menu
        <i><b>M</b></i>Mute
        <i><b>H</b></i>Stats
        <i><b>F</b></i>Lamp
        <i><b>C</b></i>Classic glide
        <i><b>L</b></i>Link to this view
        <i><b>P</b></i>Photo
        <i><b>T</b></i>Tour
      </p>
    </div>
    <p id=touch-hint>Hold to swim forward · slide to steer · second finger for the scooter</p>
  </div>
</div>
<button id=open-menu aria-label=Menu>≡</button>
<button id=mute aria-label=Sound aria-pressed=false>♪</button>
<pre id=stats></pre>
<p id=note aria-live=polite></p>
<script>
/*SCRIPT*/
</script>
</body>
</html>
