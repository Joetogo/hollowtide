  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fe9f6"/>
      <stop offset=".45" stop-color="#1493ab"/>
      <stop offset="1" stop-color="#03222d"/>
    </linearGradient>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".15" stop-color="#f6feff"/>
      <stop offset=".6" stop-color="#c3f0f6"/>
      <stop offset="1" stop-color="#1c7c92"/>
    </linearGradient>
    <clipPath id="c"><rect width="64" height="64" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
