<!-- The page's icon: the whale's tail that stands on the seabed at the first viewpoint, rising out of the deep
     into the light. The build puts it into the page as its tab icon; docs/icon.png is the same picture for
     where a PNG is wanted (npm run shots:readme draws it). -->
