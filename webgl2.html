<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>WebGL 2 HDR smoke test</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; user-select: none; }
  #scene { display: block; width: 100vw; height: 100vh; }
  #hud {
    position: fixed; left: 0; right: 0; top: 0; padding: 1em 1.2em;
    font: 600 20px/1.45 system-ui, sans-serif; color: #e8fbff;
    text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none;
  }
  #hud b { font-weight: 800; }
  .ok { color: #7fffb2; } .bad { color: #ff8f8f; }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud">starting…</div>
<script>
const hud = document.getElementById('hud');
const show = (html) => { hud.innerHTML = html; };
const fail = (msg) => { show(`<b class="bad">WebGL 2 HDR: FAILED</b><br>${msg}`); throw new Error(msg); };

try {
  const canvas = document.getElementById('scene');
  const gl = canvas.getContext('webgl2', { antialias: false, alpha: false });
  if (!gl) fail('No WebGL 2 context.');

  // The whole renderer draws into a floating-point HDR buffer, then tone-maps. That needs this extension.
  const floatExt = gl.getExtension('EXT_color_buffer_float');
  if (!floatExt) fail('No EXT_color_buffer_float — cannot render to a 16-bit float buffer.');
  gl.getExtension('OES_texture_float_linear'); // nice-to-have: smooth sampling of the float buffer

  const dpr = Math.min(devicePixelRatio || 1, 2);
  let W = 0, H = 0;

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail('Shader compile: ' + gl.getShaderInfoLog(s));
    return s;
  };
  const program = (vs, fs) => {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Program link: ' + gl.getProgramInfoLog(p));
    return p;
  };

  // A single fullscreen triangle, drawn with gl_VertexID — no vertex buffers needed.
  const VERT = `#version 300 es
  out vec2 uv;
  void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    uv = p;                         // 0..2
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
  }`;

  // Pass 1: a procedural underwater look written in LINEAR light, with highlights well above 1.0.
  const SCENE = `#version 300 es
  precision highp float;
  in vec2 uv;
  out vec4 color;
  uniform float t;
  uniform vec2 res;
  float hash(vec2 p){ return fract(sin(dot(p, vec2(41.3, 289.1))) * 43758.5453); }
  float noise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    vec2 u = f*f*(3.0-2.0*f);
    return mix(mix(hash(i), hash(i+vec2(1,0)), u.x),
               mix(hash(i+vec2(0,1)), hash(i+vec2(1,1)), u.x), u.y);
  }
  void main(){
    vec2 p = (uv - 0.5) * vec2(res.x/res.y, 1.0);
    // depth gradient of the water
    vec3 deep = vec3(0.004, 0.05, 0.09);
    vec3 shallow = vec3(0.02, 0.22, 0.26);
    vec3 col = mix(deep, shallow, smoothstep(0.7, -0.7, uv.y));
    // drifting caustics
    float c = 0.0;
    for (float i = 1.0; i <= 3.0; i++){
      c += noise(p * (6.0*i) + vec2(t*0.25*i, t*0.17*i)) / i;
    }
    c = pow(max(c - 0.55, 0.0) * 2.2, 3.0);
    col += vec3(0.5, 0.95, 1.0) * c * 5.0;      // HDR highlight, > 1.0 on purpose
    // god-rays from top
    float ray = pow(max(0.0, 1.0 - abs(p.x*1.3 + sin(t*0.3)*0.2)), 6.0) * smoothstep(1.0,-0.2,uv.y);
    col += vec3(0.6, 0.9, 1.0) * ray * 3.0;
    color = vec4(col, 1.0);
  }`;

  // Pass 2: sample the float buffer and tone-map (ACES) to the screen — proving the float texture is readable.
  const BLIT = `#version 300 es
  precision highp float;
  in vec2 uv;
  out vec4 color;
  uniform sampler2D hdr;
  vec3 aces(vec3 x){
    return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0);
  }
  void main(){
    vec3 c = texture(hdr, uv * 0.5).rgb;        // uv is 0..2; the triangle covers 0..1 of the screen
    color = vec4(pow(aces(c), vec3(1.0/2.2)), 1.0);
  }`;

  const sceneProg = program(VERT, SCENE);
  const blitProg = program(VERT, BLIT);
  const uT = gl.getUniformLocation(sceneProg, 't');
  const uRes = gl.getUniformLocation(sceneProg, 'res');
  const uHdr = gl.getUniformLocation(blitProg, 'hdr');

  const vao = gl.createVertexArray(); // empty, but WebGL 2 requires one bound to draw
  const tex = gl.createTexture();
  const fbo = gl.createFramebuffer();

  const resize = () => {
    W = Math.round(innerWidth * dpr); H = Math.round(innerHeight * dpr);
    canvas.width = W; canvas.height = H;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, W, H, 0, gl.RGBA, gl.HALF_FLOAT, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE)
      fail('Float framebuffer incomplete — RGBA16F not renderable here.');
  };
  resize();
  addEventListener('resize', resize);

  let frames = 0, fps = 0, since = performance.now();
  const chip = `${W}×${H} · float buffer OK`;

  const draw = (now) => {
    const t = now / 1000;
    gl.bindVertexArray(vao);

    // Pass 1 → float FBO
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, W, H);
    gl.useProgram(sceneProg);
    gl.uniform1f(uT, t);
    gl.uniform2f(uRes, W, H);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    // Pass 2 → screen
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(blitProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(uHdr, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    frames++;
    if (now - since >= 500) { fps = Math.round((frames * 1000) / (now - since)); frames = 0; since = now; }
    show(`<b class="ok">WebGL 2 HDR: OK</b> · ${fps} fps<br>${chip}`);
    requestAnimationFrame(draw);
  };
  requestAnimationFrame(draw);
} catch (e) {
  if (!/FAILED/.test(hud.textContent)) show(`<b class="bad">WebGL 2 HDR: FAILED</b><br>${e.message}`);
}
</script>
</body>
</html>
